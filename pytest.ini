[pytest]
# The repository root must be importable for `from shared_utils.erlang_c import
# ...` to resolve.
#
# This was previously implicit and version-dependent: pytest only inserts the
# rootdir into sys.path under its "prepend" import mode from 3.11 onward in some
# layouts, so the suite passed on Python 3.11 and failed to import on 3.9 and
# 3.10 (ModuleNotFoundError: No module named 'shared_utils'). Naming it here
# makes it deterministic on every version in the CI matrix.
pythonpath = .
testpaths = tests